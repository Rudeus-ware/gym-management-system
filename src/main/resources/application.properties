# =============================================================================
# Gym Management System - Database Configuration
# =============================================================================

# Database Connection Settings
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/gym_db?useSSL=false&serverTimezone=UTC
db.username=root
db.password=

# Connection Pool Settings
db.maxPoolSize=10
db.minPoolSize=2
db.connectionTimeout=30000
db.idleTimeout=600000
db.maxLifetime=1800000

# Database Initialization
db.init-on-start=true
db.schema=classpath:database/schema.sql